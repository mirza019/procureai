[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "procureai"
version = "0.1.0"
description = "AI-powered procurement intelligence and supplier risk control tower"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "alembic>=1.13,<2", "apscheduler>=3.10,<4", "azure-storage-blob>=12.20,<13",
  "bcrypt>=4.2,<6", "fastapi>=0.115,<1", "httpx>=0.27,<1", "nicegui>=2.0,<3", "numpy>=2.0,<3",
  "openpyxl>=3.1,<4", "pandas>=2.2,<3", "passlib[bcrypt]>=1.7,<2",
  "plotly>=5.24,<7", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.5,<3",
  "pyjwt>=2.9,<3", "reportlab>=4.2,<5", "scikit-learn>=1.5,<2",
  "sqlalchemy>=2.0,<3", "structlog>=24.4,<26", "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "pytest-cov>=5,<7", "ruff>=0.7,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/procureai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"apps/frontend/*.py" = ["SIM117", "PLC0206"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"
