name: Publish Azure demo container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile.azure
      - apps/**
      - src/**
      - scripts/**
      - alembic/**
      - alembic.ini
      - pyproject.toml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.azure
          push: true
          tags: ghcr.io/mirza019/procureai:latest
